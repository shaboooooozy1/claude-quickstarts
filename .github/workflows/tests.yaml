name: tests
on:
  pull_request:
    paths:
      - .github/**
      - computer-use-demo/**
  push:
    branches:
      - main
    paths:
      - .github/**
      - computer-use-demo/**
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: computer-use-demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/ruff-action@d0a0e814ec17e92d33be7d24dd922b479f1bcd38 # v1.1.1
        with:
          src: "computer-use-demo"
  pyright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: computer-use-demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          cache: "pip"
          python-version: "3.11.6"
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r dev-requirements.txt
      - run: echo "$PWD/.venv/bin" >> $GITHUB_PATH
      - uses: jakebailey/pyright-action@6baf8b2bcc1727b5a89249955f936d4a6f9f995b # v1
        with:
          working-directory: computer-use-demo
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: computer-use-demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          cache: "pip"
          python-version: "3.11.6"
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r dev-requirements.txt
      - run: echo "$PWD/.venv/bin" >> $GITHUB_PATH
      - run: pytest tests --junitxml=junit/test-results.xml
